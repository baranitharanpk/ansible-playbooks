---
- name: Deploy to Apache Servers
  hosts: apache_servers
  become: true
  gather_facts: true

  vars:
    webapp_source_dir: "{{ lookup('env', 'WORKSPACE') }}/webapp"
    web_root: /var/www/html

  tasks:
    - name: Update yum cache
      yum:
        update_cache: yes

    - name: Install Apache
      yum:
        name: httpd
        state: present

    - name: Start and enable Apache
      service:
        name: httpd
        state: started
        enabled: yes

    - name: Copy web files
      copy:
        src: "{{ webapp_source_dir }}/"
        dest: "{{ web_root }}/"
        owner: apache
        group: apache
        mode: '0644'

    - name: Restart Apache
      service:
        name: httpd
        state: restarted


- name: Deploy to Nginx Servers
  hosts: nginx_servers
  become: true
  gather_facts: true

  vars:
    webapp_source_dir: "{{ lookup('env', 'WORKSPACE') }}/webapp"
    web_root: /usr/share/nginx/html

  tasks:
    - name: Update yum cache
      yum:
        update_cache: yes

    - name: Install Nginx
      yum:
        name: nginx
        state: present

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Copy web files
      copy:
        src: "{{ webapp_source_dir }}/"
        dest: "{{ web_root }}/"
        owner: nginx
        group: nginx
        mode: '0644'

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
