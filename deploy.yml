---
- name: Deploy to Apache Servers
  hosts: apache_servers
  become: true
  gather_facts: true

  vars:
    webapp_source_dir: "{{ lookup('env', 'WORKSPACE') }}/webapp"
    web_root: /var/www/html

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Copy web files
      copy:
        src: "{{ webapp_source_dir }}/"
        dest: "{{ web_root }}/"
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Restart Apache
      service:
        name: apache2
        state: restarted

- name: Deploy to Nginx Servers
  hosts: nginx_servers
  become: true
  gather_facts: true

  vars:
    webapp_source_dir: "{{ lookup('env', 'WORKSPACE') }}/webapp"
    web_root: /var/www/html

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Copy web files
      copy:
        src: "{{ webapp_source_dir }}/"
        dest: "{{ web_root }}/"
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
