---
- name: Deploy to Apache Servers
  hosts: apache_servers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Apache2
      apt:
        name: apache2
        state: present

    - name: Create web directory
      file:
        path: /var/www/html
        state: directory
        mode: "0755"

    - name: Deploy index.html
      copy:
        dest: /var/www/html/index.html
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html>
          <head><title>Apache Server</title></head>
          <body>
          <h1>Apache Web Server</h1>
          <p>Deployed via Ansible</p>
          </body>
          </html>

    - name: Ensure Apache2 is running
      service:
        name: apache2
        state: started
        enabled: yes

- name: Deploy to Nginx Servers
  hosts: nginx_servers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Create web directory
      file:
        path: /var/www/html
        state: directory
        mode: "0755"

    - name: Deploy index.html
      copy:
        dest: /var/www/html/index.html
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html>
          <head><title>Nginx Server</title></head>
          <body>
          <h1>Nginx Web Server</h1>
          <p>Deployed via Ansible</p>
          </body>
          </html>

    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: yes
