        mode: '0644'
      notify: restart nginx
      tags: deploy
      ignore_errors: yes
    
    - name: Set proper permissions
      file:
        path: "{{ web_root }}"
        owner: www-data
        group: www-data
        recurse: yes
      tags: permissions
    
    - name: Create deployment marker
      copy:
        content: |
          Server Type: Nginx
