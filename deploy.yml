  post_tasks:
    - name: Display Nginx deployment success
      debug:
        msg:
          - "========================================="
          - "✅ NGINX DEPLOYMENT SUCCESSFUL"
          - "========================================="
          - "Server: {{ inventory_hostname }}"
          - "URL: http://{{ ansible_default_ipv4.address }}"
          - "Time: {{ ansible_date_time.iso8601 }}"
          - "========================================="
  
  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted

- name: Display Final Deployment Summary
  hosts: localhost
  gather_facts: no
  
  tasks:
    - name: Show complete deployment summary
      debug:
        msg:
          - "========================================="
          - "🎉 COMPLETE DEPLOYMENT SUMMARY"
          - "========================================="
          - "Apache Servers Deployed: {{ groups['apache_servers'] | length }}"
          - "Nginx Servers Deployed: {{ groups['nginx_servers'] | length }}"
          - "Total Servers: {{ groups['webservers'] | length }}"
          - ""
          - "Apache Server IPs:"
          - "{{ groups['apache_servers'] | join('\n') }}"
          - ""
          - "Nginx Server IPs:"
          - "{{ groups['nginx_servers'] | join('\n') }}"
          - ""
          - "All servers are now serving your web application!"
          - "========================================="
