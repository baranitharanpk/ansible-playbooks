# ansible.cfg
[defaults]
# Inventory file location
inventory = inventory/hosts.ini

# Don't check SSH host keys (for dynamic infrastructure)
host_key_checking = False

# Disable creation of retry files
retry_files_enabled = False

# Connection timeout
timeout = 30

# Number of parallel processes
forks = 10

# Display settings - CORRECTED
stdout_callback = default
result_format = yaml

# Logging - CORRECTED (will be created in workspace instead)
log_path = ./ansible.log

[inventory]
# Enable plugins for dynamic inventory
enable_plugins = aws_ec2, ini

[privilege_escalation]
# Privilege escalation settings
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH connection settings
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
